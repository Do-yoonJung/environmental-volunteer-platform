$kind: http-request
url: http://localhost:5001/api/feedback/my/{{eventID}}
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is under 5000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response body has required fields", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("_id");
          pm.expect(jsonData).to.have.property("eventId");
          pm.expect(jsonData).to.have.property("volunteerId");
          pm.expect(jsonData).to.have.property("rating");
          pm.expect(jsonData).to.have.property("comment");
          pm.expect(jsonData).to.have.property("createdAt");
          pm.expect(jsonData).to.have.property("updatedAt");
      });

      pm.test("Returns the feedback submitted earlier", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData._id).to.equal(pm.variables.get("feedbackId"));
      });

      pm.test("Feedback belongs to the event in the URL", function () {
          var jsonData = pm.response.json();
          var path = pm.request.url.path; // ["api","feedback","my",eventId]
          pm.expect(jsonData.eventId).to.equal(path[3]);
      });

      pm.test("Feedback belongs to the logged-in volunteer", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.volunteerId).to.equal(pm.variables.get("volunteerId"));
      });

      pm.test("Rating is an integer between 1 and 5", function () {
          var rating = pm.response.json().rating;
          pm.expect(Number.isInteger(rating)).to.be.true;
          pm.expect(rating).to.be.within(1, 5);
      });
    language: text/javascript
order: 23000
