$kind: http-request
name: Delete event
url: http://localhost:5001/api/events/{{eventID}}
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response time is under 2000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      pm.test(\"Content-Type is application/json\", function () {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"ap\
      plication/json\");\r

      });\r

      \r

      pm.test(\"Response body has required fields\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property(\"message\");\r

      });\r

      \r

      pm.test(\"Message is correct\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.message).to.include(\"Event deleted\");\r

      });\r

      \r

      pm.environment.unset('eventID');"
    language: text/javascript
order: 39000
