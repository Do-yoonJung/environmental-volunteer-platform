$kind: http-request
url: http://localhost:5001/api/analytics/event/{{eventID}}
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403", function () {
          pm.response.to.have.status(403);
      });

      pm.test("Response time is under 5000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response body has message field", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("message");
      });

      pm.test("Correct error message", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.message).to.equal("You can only view analytics for events you manage");
      });

      pm.test("No analytics data leaked", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.not.have.property("event");
          pm.expect(jsonData).to.not.have.property("attendance");
          pm.expect(jsonData).to.not.have.property("feedback");
      });
    language: text/javascript
order: 36000
