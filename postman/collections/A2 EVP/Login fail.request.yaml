$kind: http-request
url: http://localhost:5001/api/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \"email\": \"NaN@connect.qut.edu.au\",\r

    \"password\": \"NaN\"\r

    }"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response body has required fields (one message)", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("message");
      });

      pm.test("Message is a non-empty string", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.message).to.be.a("string").and.to.have.length.above(0);
      });

      pm.test("Error message is correct", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.message).to.include("Invalid email or password");
      });
    language: text/javascript
order: 2000
