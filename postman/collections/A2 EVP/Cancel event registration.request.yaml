$kind: http-request
url: http://localhost:5001/api/registrations/{{eventID}}/cancel
method: PUT
body:
  type: json
  content: "{\r

    \    \"eventId\": \"{{eventID}}\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response time is under 5000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(5000);\r

      });\r

      \r

      pm.test(\"Content-Type is application/json\", function () {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"ap\
      plication/json\");\r

      });\r

      \r

      pm.test(\"Response body has required fields\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property(\"registration\");\r

      \    pm.expect(jsonData).to.have.property(\"message\");\r

      \    pm.expect(jsonData[\"registration\"]).to.have.property(\"eventId\");\
      \r

      \    pm.expect(jsonData[\"registration\"]).to.have.property(\"volunteerId\
      \");\r

      \    pm.expect(jsonData[\"registration\"]).to.have.property(\"status\");\r

      \    pm.expect(jsonData[\"registration\"]).to.have.property(\"reminderSen\
      tAt\");\r

      });\r

      \r

      pm.test(\"Status is 'cancelled'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData[\"registration\"].status).to.equal(\"cancelled\");\
      \r

      });\r

      \r

      pm.test(\"Correct message\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.message).to.include(\"Registration cancelled
      successfully\");\r

      });"
    language: text/javascript
order: 31000
