$kind: http-request
name: Read Event
url: http://localhost:5001/api/events
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "\r

      pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response time is under 2000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(2000);\r

      });\r

      \r

      pm.test(\"Content-Type is application/json\", function () {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"ap\
      plication/json\");\r

      });\r

      \r

      pm.test(\"Response body has required fields\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData[0]).to.have.property(\"userId\");\r

      \    pm.expect(jsonData[0]).to.have.property(\"title\");\r

      \    pm.expect(jsonData[0]).to.have.property(\"description\");\r

      \    pm.expect(jsonData[0]).to.have.property(\"completed\");\r

      \    pm.expect(jsonData[0]).to.have.property(\"deadline\");\r

      });"
    language: text/javascript
order: 5789
