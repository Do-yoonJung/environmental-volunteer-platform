$kind: http-request
url: http://localhost:5001/api/attendance/{{eventID}}/{{volunteerId}}
method: POST
body:
  type: json
  content: "{\r\n  \"status\": \"present\"\r\n}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 403\", function () {\r

      \    pm.response.to.have.status(403);\r

      });\r

      \r

      pm.test(\"Response time is under 5000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(5000);\r

      });\r

      \r

      pm.test(\"Content-Type is application/json\", function () {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"ap\
      plication/json\");\r

      });\r

      \r

      pm.test(\"Response body has message field\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property(\"message\");\r

      });\r

      \r

      pm.test(\"Correct error message\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.message).to.equal(\"Not authorized to manage
      attendance for this event\");\r

      });\r

      \r

      pm.test(\"No attendance record returned\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.not.have.property(\"_id\");\r

      \    pm.expect(jsonData).to.not.have.property(\"status\");\r

      });"
    language: text/javascript
order: 16000
