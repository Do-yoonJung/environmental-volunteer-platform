$kind: http-request
url: http://localhost:5001/api/analytics/event/{{eventID}}
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is under 5000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response body has required fields", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("event");
          pm.expect(jsonData).to.have.property("attendance");
          pm.expect(jsonData).to.have.property("feedback");
          pm.expect(jsonData["event"]).to.have.property("_id");
          pm.expect(jsonData["event"]).to.have.property("title");
          pm.expect(jsonData["attendance"]).to.have.property("registered");
          pm.expect(jsonData["attendance"]).to.have.property("present");
          pm.expect(jsonData["attendance"]).to.have.property("absent");
          pm.expect(jsonData["attendance"]).to.have.property("attendanceRate");
          pm.expect(jsonData["attendance"]).to.have.property("hasAttendanceData");
          pm.expect(jsonData["feedback"]).to.have.property("feedbackCount");
          pm.expect(jsonData["feedback"]).to.have.property("averageRating");
          pm.expect(jsonData["feedback"]).to.have.property("hasFeedbackData");
      });

      pm.test("Event matches the event in the URL", function () {
          var jsonData = pm.response.json();
          var path = pm.request.url.path; // ["api","analytics","event",eventId]
          pm.expect(jsonData.event._id).to.equal(path[3]);
      });

      pm.test("Attendance rate is calculated correctly", function () {
          var a = pm.response.json().attendance;
          if (a.registered > 0) {
              var expected = Number(((a.present / a.registered) * 100).toFixed(2));
              pm.expect(a.attendanceRate).to.equal(expected);
          } else {
              pm.expect(a.attendanceRate).to.be.null;
          }
      });

      pm.test("Attendance data flag is consistent", function () {
          var a = pm.response.json().attendance;
          pm.expect(a.hasAttendanceData).to.equal(a.present + a.absent > 0);
      });

      pm.test("Feedback data is consistent", function () {
          var f = pm.response.json().feedback;
          pm.expect(f.hasFeedbackData).to.equal(f.feedbackCount > 0);
          if (f.feedbackCount > 0) {
              pm.expect(f.averageRating).to.be.within(1, 5);
          } else {
              pm.expect(f.averageRating).to.be.null;
          }
      });

      pm.test("Analytics reflect this test run", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.attendance.registered).to.equal(0);
          pm.expect(jsonData.attendance.present).to.equal(0);
          pm.expect(jsonData.attendance.absent).to.equal(1);
          pm.expect(jsonData.attendance.attendanceRate).to.equal(null);
          pm.expect(jsonData.feedback.feedbackCount).to.equal(1);
          pm.expect(jsonData.feedback.averageRating).to.equal(4);
      });
    language: text/javascript
order: 38000
