$kind: http-request
url: http://localhost:5001/api/attendance/{{eventID}}/{{volunteerId}}
method: POST
body:
  type: json
  content: "{\r\n  \"status\": \"present\"\r\n}"
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 201\", function () {\r

      \    pm.response.to.have.status(201);\r

      });\r

      \r

      pm.test(\"Response time is under 5000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(5000);\r

      });\r

      \r

      pm.test(\"Content-Type is application/json\", function () {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"ap\
      plication/json\");\r

      });\r

      \r

      pm.test(\"Response body has required fields\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property(\"_id\");\r

      \    pm.expect(jsonData).to.have.property(\"eventId\");\r

      \    pm.expect(jsonData).to.have.property(\"volunteerId\");\r

      \    pm.expect(jsonData).to.have.property(\"status\");\r

      \    pm.expect(jsonData).to.have.property(\"createdAt\");\r

      \    pm.expect(jsonData).to.have.property(\"updatedAt\");\r

      });\r

      \r

      pm.test(\"Status is 'present'\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.status).to.equal(\"present\");\r

      });\r

      \r

      pm.test(\"Attendance matches the event and volunteer in the URL\",
      function () {\r

      \    var jsonData = pm.response.json();\r

      \    var path = pm.request.url.path; //
      [\"api\",\"attendance\",eventId,volunteerId]\r

      \    pm.expect(jsonData.eventId).to.equal(path[2]);\r

      \    pm.expect(jsonData.volunteerId).to.equal(path[3]);\r

      });"
    language: text/javascript
order: 14000
