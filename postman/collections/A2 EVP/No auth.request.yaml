$kind: http-request
url: http://localhost:5001/api/registrations/me
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });

      pm.test("Response time is under 5000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response body has message field", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("message");
      });

      pm.test("Correct error message", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.message).to.equal("Not authorized, no token");
      });

      pm.test("No Authorization header was sent", function () {
          pm.expect(pm.request.headers.has("Authorization")).to.be.false;
      });

      pm.test("No protected data returned", function () {
          var jsonData = pm.response.json();
          pm.expect(Object.keys(jsonData)).to.eql(["message"]);
      });
    language: text/javascript
order: 1000
