$kind: http-request
name: Get Feedback
url: http://localhost:5001/api/feedback/event/{{eventID}}
method: GET
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 403\", function () {\r

      \    pm.response.to.have.status(403);\r

      });\r

      \r

      pm.test(\"Response time is under 5000ms\", function () {\r

      \    pm.expect(pm.response.responseTime).to.be.below(5000);\r

      });\r

      \r

      pm.test(\"Content-Type is application/json\", function () {\r

      \    pm.expect(pm.response.headers.get(\"Content-Type\")).to.include(\"application/json\");\r

      });\r

      \r

      pm.test(\"Response body has message field\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.have.property(\"message\");\r

      });\r

      \r

      pm.test(\"Correct error message\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.message).to.equal(\"You can only view feedback for events you manage\");\r

      });\r

      \r

      pm.test(\"No feedback data leaked\", function () {\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData).to.not.have.property(\"feedback\");\r

      \    pm.expect(jsonData).to.not.have.property(\"event\");\r

      });"
    language: text/javascript
order: 35000
