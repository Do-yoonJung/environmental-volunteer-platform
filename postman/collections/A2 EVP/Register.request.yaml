$kind: http-request
url: http://localhost:5001/api/auth/register
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"name\": \"Register Test\",\r

    \    \"email\": \"new11@gmail.com\",\r

    \    \"password\": \"new\",\r

    \    \"role\": \"volunteer\"\r

    }"
scripts:
  - type: afterResponse
    code: |+
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response body has required fields", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
          pm.expect(jsonData).to.have.property("name");
          pm.expect(jsonData).to.have.property("email");
          pm.expect(jsonData).to.have.property("role");
          pm.expect(jsonData).to.have.property("token");
      });

      pm.test("Token is a non-empty string", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.token).to.be.a("string").and.to.have.length.above(0);
      });

      pm.test("Role is a valid value", function () {
          var jsonData = pm.response.json();
          pm.expect(["volunteer", "admin", "coordinator"]).to.include(jsonData.role);
      });

    language: text/javascript
order: 3000
