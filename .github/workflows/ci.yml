name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Backend and Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: MONGO_URI

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Yarn
        run: npm install --global yarn@1

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: yarn install

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: yarn install

      - name: Build Frontend
        working-directory: ./frontend
        run: yarn run build

  deploy-jess:
    name: Deploy to Jess
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH for Jess
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.JESS2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST_JESS }}" >> ~/.ssh/known_hosts

      - name: Deploy application to Jess
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST_JESS }}" 'bash -se' <<'REMOTE_SCRIPT'
          cd /home/ubuntu/environmental-volunteer-platform
          git checkout main
          git pull --ff-only origin main

          cd backend
          npm ci

          cd ../frontend
          npm ci
          npm run build

          sudo rm -rf /var/www/html/*
          sudo cp -a /home/ubuntu/environmental-volunteer-platform/frontend/build/. /var/www/html/

          sudo systemctl reload apache2

          cd /home/ubuntu/environmental-volunteer-platform/backend
          pm2 restart evp-backend
          pm2 status
          REMOTE_SCRIPT

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  deploy-jess2:
    name: Deploy to Jess2
    needs: deploy-jess
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH for Jess2
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.JESS2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST_JESS2 }}" >> ~/.ssh/known_hosts

      - name: Deploy application to Jess2
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST_JESS2 }}" 'bash -se' <<'REMOTE_SCRIPT'
          cd /home/ubuntu/environmental-volunteer-platform
          git checkout main
          git pull --ff-only origin main

          cd backend
          npm ci

          cd ../frontend
          npm ci
          npm run build

          sudo rm -rf /var/www/html/*
          sudo cp -a /home/ubuntu/environmental-volunteer-platform/frontend/build/. /var/www/html/

          sudo systemctl reload apache2

          cd /home/ubuntu/environmental-volunteer-platform/backend
          pm2 restart evp-backend
          pm2 status
          REMOTE_SCRIPT

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key