name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Backend and Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: MONGO_URI

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Yarn
        run: npm install --global yarn@1

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: yarn install

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PORT: ${{ secrets.PORT }}
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: yarn install

      - name: Build Frontend
        working-directory: ./frontend
        run: yarn run build

  deploy-jess:
    name: Deploy to Jess
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: MONGO_URI

    steps:
      - name: Display Jess runner IP and wait
        shell: bash
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          echo "================================================"
          echo "ADD THIS TO JESS SECURITY GROUP: $RUNNER_IP/32"
          echo "================================================"
          echo "Waiting 10 minutes for the SSH rule to be added..."
          sleep 600

      - name: Validate Jess deployment secrets
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.JESS_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST_JESS }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::JESS_SSH_PRIVATE_KEY is empty or unavailable."
            exit 1
          fi

          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST_JESS is empty or unavailable."
            exit 1
          fi

          if [ -z "$EC2_USERNAME" ]; then
            echo "::error::EC2_USERNAME is empty or unavailable."
            exit 1
          fi

      - name: Configure SSH for Jess
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.JESS_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

      - name: Deploy application to Jess
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_JESS }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$EC2_USERNAME@$EC2_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -e

          cd /home/ubuntu/environmental-volunteer-platform
          git checkout main
          git pull --ff-only origin main

          cd backend
          npm ci

          cd ../frontend
          npm ci
          npm run build

          sudo rm -rf /var/www/html/*
          sudo cp -a /home/ubuntu/environmental-volunteer-platform/frontend/build/. /var/www/html/
          sudo systemctl reload apache2

          cd /home/ubuntu/environmental-volunteer-platform/backend
          pm2 restart evp-backend
          pm2 status
          REMOTE_SCRIPT

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key"

  deploy-jess2:
    name: Deploy to Jess2
    needs: deploy-jess
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: MONGO_URI

    steps:
      - name: Display Jess2 runner IP and wait
        shell: bash
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          echo "================================================"
          echo "ADD THIS TO JESS2 SECURITY GROUP: $RUNNER_IP/32"
          echo "================================================"
          echo "Waiting 10 minutes for the SSH rule to be added..."
          sleep 600

      - name: Validate Jess2 deployment secrets
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.JESS_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST_JESS2 }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::JESS_SSH_PRIVATE_KEY is empty or unavailable."
            exit 1
          fi

          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST_JESS2 is empty or unavailable."
            exit 1
          fi

          if [ -z "$EC2_USERNAME" ]; then
            echo "::error::EC2_USERNAME is empty or unavailable."
            exit 1
          fi

      - name: Configure SSH for Jess2
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.JESS_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

      - name: Deploy application to Jess2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_JESS2 }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 \
            "$EC2_USERNAME@$EC2_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -e
                    export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm use default || nvm use --lts || nvm use node
          fi

          node --version
          npm --version
          cd /home/ubuntu/environmental-volunteer-platform
          git checkout main
          git pull --ff-only origin main

          cd backend
          npm ci

          cd ../frontend
          npm ci
          npm run build

          sudo rm -rf /var/www/html/*
          sudo cp -a /home/ubuntu/environmental-volunteer-platform/frontend/build/. /var/www/html/
          sudo systemctl reload apache2

          cd /home/ubuntu/environmental-volunteer-platform/backend
          pm2 restart evp-backend
          pm2 status
          REMOTE_SCRIPT

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/deploy_key"
